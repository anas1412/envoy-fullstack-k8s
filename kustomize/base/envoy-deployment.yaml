apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.39.0
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: http
              containerPort: 80
            - name: postgres
              containerPort: 1999
            - name: admin
              containerPort: 9901
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
            - name: envoy-users
              mountPath: /etc/envoy/users.htpasswd
              subPath: users.htpasswd
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
          livenessProbe:
            httpGet:
              path: /ready
              port: admin
      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
        - name: envoy-users
          secret:
            secretName: envoy-users
