apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # With --web.route-prefix=/prometheus, Prometheus serves even its own
      # /metrics under the prefix.
      - job_name: prometheus
        metrics_path: /prometheus/metrics
        static_configs:
          - targets: ["localhost:9090"]
      # Envoy's admin interface speaks Prometheus natively at /stats/prometheus.
      - job_name: envoy
        metrics_path: /stats/prometheus
        static_configs:
          - targets: ["envoy-l4:9901"]
      # The postgres exporter is scraped directly in-cluster.
      - job_name: postgres
        static_configs:
          - targets: ["postgres-exporter:9187"]
