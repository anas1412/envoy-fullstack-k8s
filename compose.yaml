name: envoy-stack

services:
  envoy:
    image: envoyproxy/envoy:v1.39.0
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/users.htpasswd:/etc/envoy/users.htpasswd:ro
    ports:
      - "80:80"
      - "1999:1999"
    restart: unless-stopped

  product:
    build: ./frontend/product
    restart: unless-stopped

  monitor:
    build: ./frontend/monitor
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 3000
      PG_HOST: envoy
      PG_PORT: 1999
      PG_DATABASE: ${PG_DATABASE:?set PG_DATABASE in .env}
      PG_USER: ${PG_USER:?set PG_USER in .env}
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      ENVOY_ADMIN: http://envoy:9901
    depends_on:
      postgres:
        condition: service_healthy
      envoy:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${PG_USER:?set PG_USER in .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DATABASE:?set PG_DATABASE in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
